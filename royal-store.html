<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر الملكي - الرتب المميزة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(99, 102, 241, 0.2);
            --primary-color: #6366f1;
            --accent-gold: #ffd700;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
        }

        .store-header {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary-color);
        }

        .store-title {
            font-size: 22px;
            font-weight: 900;
            color: var(--accent-gold);
            text-align: center;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .store-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .rank-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .rank-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: var(--primary-color);
            opacity: 0.8;
        }

        .rank-card.king::before { background: #ffd700; }
        .rank-card.prince::before { background: #38bdf8; }
        .rank-card.star::before { background: #818cf8; }
        .rank-card.crown::before { background: #f43f5e; }

        .rank-card:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.2);
        }

        .rank-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .rank-icon {
            font-size: 36px;
            background: rgba(255, 255, 255, 0.05);
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .rank-details h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .rank-price {
            font-size: 14px;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .buy-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .buy-btn:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .payment-notice {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-color);
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
        }

        .payment-notice i {
            color: var(--accent-gold);
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div class="store-header">
        <a href="chat.html" class="back-btn">
            <i class="fa-solid fa-arrow-right"></i> رجوع
        </a>
        <div class="store-title">
            <i class="fa-solid fa-crown" style="color: #ffd700;"></i> المتجر الملكي
        </div>
        <div style="width: 60px;"></div>
    </div>

    <div class="store-container">
        <!-- رتبة الملك أو الملكة -->
        <div class="rank-card king">
            <div class="rank-info">
                <div class="rank-icon">🏰</div>
                <div class="rank-details">
                    <h3>رتبة الملك / الملكة</h3>
                    <div class="rank-price">25,000 دينار عراقي</div>
                </div>
            </div>
            <button class="buy-btn" onclick="buyRank('رتبة الملك / الملكة', 25000)">
                <i class="fa-solid fa-bag-shopping"></i> شراء
            </button>
        </div>

        <!-- رتبة الامير أو الاميرة -->
        <div class="rank-card prince">
            <div class="rank-info">
                <div class="rank-icon">🧝🏻</div>
                <div class="rank-details">
                    <h3>رتبة الأمير / الأميرَة</h3>
                    <div class="rank-price">15,000 دينار عراقي</div>
                </div>
            </div>
            <button class="buy-btn" onclick="buyRank('رتبة الأمير / الأميرَة', 15000)">
                <i class="fa-solid fa-bag-shopping"></i> شراء
            </button>
        </div>

        <!-- رتبة العلاقة زرقاء -->
        <div class="rank-card star">
            <div class="rank-info">
                <div class="rank-icon">✵</div>
                <div class="rank-details">
                    <h3>رتبة العلاقة الزرقاء</h3>
                    <div class="rank-price">10,000 دينار عراقي</div>
                </div>
            </div>
            <button class="buy-btn" onclick="buyRank('رتبة العلاقة الزرقاء', 10000)">
                <i class="fa-solid fa-bag-shopping"></i> شراء
            </button>
        </div>

        <!-- رتبة التاج -->
        <div class="rank-card crown">
            <div class="rank-info">
                <div class="rank-icon">👑</div>
                <div class="rank-details">
                    <h3>رتبة التاج</h3>
                    <div class="rank-price">5,000 دينار عراقي</div>
                </div>
            </div>
            <button class="buy-btn" onclick="buyRank('رتبة التاج', 5000)">
                <i class="fa-solid fa-bag-shopping"></i> شراء
            </button>
        </div>
    </div>

    <div class="payment-notice">
        <i class="fa-solid fa-shield-halved"></i> قريباً سيتم إضافة الدفع الآمن عبر بطاقة <strong>كي كارد (Qi Card)</strong> لتسهيل عمليات الشراء مباشرة.
    </div>

    <script>
        function buyRank(rankName, price) {
            alert(`لقد اخترت ${rankName} بسعر ${price.toLocaleString()} د.ع.\nقريباً سيتم توجيهك لصفحة الدفع عبر بطاقة كي كارد.`);
        }
    </script>





<script>
    document.addEventListener('DOMContentLoaded', function() {
        const currentLang = localStorage.getItem('wasl_app_lang') || 'ar';
        if (currentLang === 'en') {
            // أولاً: ترجمة التنبيه السفلي بالكامل ككتلة واحدة قبل أي تعديل منفرد
            const noticeEl = document.querySelector('.payment-notice');
            if (noticeEl) {
                noticeEl.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Secure payment via Qi Card will be added soon to facilitate direct purchases.';
            }

            // ثانياً: ترجمة باقي عناصر الصفحة
            document.body.innerHTML = document.body.innerHTML
                .replace(/المتجر الملكي - الرتب المميزة/g, 'Royal Store - Premium Ranks')
                .replace(/المتجر الملكي/g, 'Royal Store')
                .replace(/رجوع/g, 'Back')
                .replace(/رتبة الملك \/ الملكة/g, 'King / Queen Rank')
                .replace(/رتبة الأمير \/ الأميرَة/g, 'Prince / Princess Rank')
                .replace(/رتبة العلاقة الزرقاء/g, 'Blue Relation Rank')
                .replace(/رتبة التاج/g, 'Crown Rank')
                .replace(/25,000 دينار عراقي/g, '25,000 IQD')
                .replace(/15,000 دينار عراقي/g, '15,000 IQD')
                .replace(/10,000 دينار عراقي/g, '10,000 IQD')
                .replace(/5,000 دينار عراقي/g, '5,000 IQD')
                .replace(/>شراء</g, '>Buy<');
        }
    });
</script>

  
</body>
</html>
