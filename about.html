<script>
function goBackToSettings() {
    // حفظ إشارة لفتح الإعدادات فور العودة
    localStorage.setItem('open_settings', 'true');
    // العودة لصفحة الدردشة
    window.location.href = 'chat.html';

</script>
   
        
        <!-- إضافة الموقع الجغرافي -->
        <div class="location">
            <div>العراق - بغداد</div>
            <div>IRAQ - BAGHDAD</div>
            <div style="font-size: 13px; color: #777; margin-top: 5px;">2026-2026</div>
        </div>
    </div>









<script>
  document.addEventListener('DOMContentLoaded', () => {
    const lang = localStorage.getItem('wasl_app_lang') || localStorage.getItem('appLanguage') || 'ar';

    if (lang === 'en') {
      document.documentElement.dir = 'ltr';
      document.documentElement.lang = 'en';

      const translations = {
        "حول التطبيق": "About App",
        "تطبيق دردشة آمن، سريع، ومصمم لتجربة مستخدم مميزة.": "A secure, fast chat application designed for a unique user experience.",
        "مدير التطبيق والمطور": "App Manager & Developer:",
        "أحمد": "Ahmed",
        "حساباتي على مواقع التواصل": "My Social Media Accounts:",
        "تيليجرام": "Telegram",
        "انستجرام": "Instagram",
        "تيك توك": "TikTok",
        "العودة للخلف": "Go Back"
      };

      // فحص جميع العناصر واستبدال النصوص بغض النظر عن النقطتين : أو المسافات
      const allElements = document.querySelectorAll('*');

      allElements.forEach(el => {
        if (el.children.length === 0 && el.textContent) {
          // تنظيف النص من النقطتين : والمسافات الزائدة للمقارنة
          const rawText = el.textContent.trim().replace(/:/g, '').trim();

          if (translations[rawText]) {
            el.textContent = translations[rawText];
          }
        }
      });

      // ترجمة alt الشعار
      const img = document.querySelector('img');
      if (img && img.alt) {
        img.alt = 'Wasl App Logo';
      }
    }
  });
</script>




</body>
