<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الرتب - Wasl</title>
    <!-- استدعاء SDK الخاصة بـ Firestore -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; padding: 15px; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 15px; }
        .header h1 { font-size: 16px; color: #38bdf8; }
        .back-btn { background: #334155; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 13px; }
        .search-box { width: 100%; background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 10px; color: #fff; font-size: 14px; margin-bottom: 15px; outline: none; }
        .stats-bar { background: #1e293b; border: 1px solid #334155; padding: 10px 15px; border-radius: 10px; font-size: 13px; color: #94a3b8; margin-bottom: 15px; }
        .users-list { display: flex; flex-direction: column; gap: 12px; }
        .user-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px; }
        .user-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .user-name { font-weight: bold; font-size: 15px; color: #fff; }
        .user-email { font-size: 11px; color: #64748b; margin-top: 2px; }
        .current-badge { background: #0f172a; color: #f59e0b; padding: 4px 8px; border-radius: 6px; font-size: 12px; border: 1px solid #334155; }
        .badge-grid { display: flex; gap: 6px; flex-wrap: wrap; }
        .badge-btn { border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-king { background: #f59e0b; color: #fff; }
        .btn-castle { background: #eab308; color: #fff; }
        .btn-queen { background: #ec4899; color: #fff; }
        .btn-princess { background: #a855f7; color: #fff; }
        .btn-verified { background: #3b82f6; color: #fff; }
        .btn-reset { background: #ef4444; color: #fff; }
        #deniedScreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #0f172a; z-index: 9999; justify-content: center; align-items: center; text-align: center; }
        .denied-card { background: #1e293b; border-radius: 16px; padding: 30px 20px; width: 85%; max-width: 350px; border: 1px solid #334155; }
        #mainDevApp { display: none; }
    </style>
</head>
<body>

    <div id="deniedScreen">
        <div class="denied-card">
            <h2 style="color: #ef4444; margin-bottom: 10px;">❌ غير مسموح بالدخول</h2>
            <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">هذه الصفحة مخصصة لحساب المطور الرئيسي فقط.</p>
            <a href="chat.html" class="back-btn">➡️ العودة للشات</a>
        </div>
    </div>

    <div id="mainDevApp">
        <div class="header">
            <h1>🛠️ لوحة المطور وإدارة الرتب</h1>
            <a href="chat.html" class="back-btn">➡️ الشات</a>
        </div>

        <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن مستخدم..." oninput="filterUsers()">

        <div class="stats-bar">
            <span>إجمالي المستخدمين: <strong id="totalUsersCount" style="color:#fff;">0</strong></span>
        </div>

        <div id="usersContainer" class="users-list">
            <p style="text-align: center; color: #94a3b8; padding: 20px;">جاري تحميل المستخدمين من Firestore...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBM_LkZr59WM4fnTvW0CKbcj-y2V8Flqto",
          authDomain: "wasl-4f5cb.firebaseapp.com",
          projectId: "wasl-4f5cb",
          storageBucket: "wasl-4f5cb.firebasestorage.app",
          messagingSenderId: "754785038144",
          appId: "1:754785038144:web:ca48f718b71148ae3394a5",
          measurementId: "G-8TMN0ER8Z3"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();

        const DEVELOPER_UID = "iB9c5FMQefeeB9Oapp7ByWlyKIe2"; 
        let allUsersData = [];

        auth.onAuthStateChanged((user) => {
            if (user && user.uid === DEVELOPER_UID) {
                document.getElementById('mainDevApp').style.display = 'block';
                document.getElementById('deniedScreen').style.display = 'none';
                loadFirestoreUsers();
            } else {
                document.getElementById('mainDevApp').style.display = 'none';
                document.getElementById('deniedScreen').style.display = 'flex';
            }
        });

        // دالة سحب الحسابات المباشرة من Firestore
        function loadFirestoreUsers() {
            const container = document.getElementById('usersContainer');
            
            db.collection("users").onSnapshot((snapshot) => {
                allUsersData = [];
                container.innerHTML = '';

                if (snapshot.empty) {
                    container.innerHTML = '<p style="text-align:center; color:#94a3b8;">لا يوجد مستخدمين مسجلين في Firestore حتى الآن.</p>';
                    document.getElementById('totalUsersCount').textContent = '0';
                    return;
                }

                snapshot.forEach((doc) => {
                    allUsersData.push({
                        uid: doc.id,
                        ...doc.data()
                    });
                });

                document.getElementById('totalUsersCount').textContent = allUsersData.length;
                renderUsers(allUsersData);
            }, (error) => {
                container.innerHTML = `<p style="text-align:center; color:#ef4444; padding:10px;">خطأ في Firestore: ${error.message}</p>`;
            });
        }

        function renderUsers(list) {
            const container = document.getElementById('usersContainer');
            container.innerHTML = '';

            list.forEach(user => {
                const badge = user.badge || 'عادي';
                const name = user.username || user.name || user.displayName || 'مستخدم بدون اسم';
                const email = user.email || 'بدون بريد';

                const card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `
                    <div class="user-info">
                        <div>
                            <div class="user-name">${name}</div>
                            <div class="user-email">${email}</div>
                        </div>
                        <span class="current-badge">${badge}</span>
                    </div>
                                        <div class="badge-grid">
                        <button class="badge-btn btn-king" onclick="setBadge('${user.uid}', '👑')">👑 ملك</button>
                        <button class="badge-btn btn-castle" onclick="setBadge('${user.uid}', '🏰')">🏰 الملك</button>
                        <button class="badge-btn btn-queen" onclick="setBadge('${user.uid}', '🏰')">🏰 الملكة</button>
                        <button class="badge-btn btn-princess" onclick="setBadge('${user.uid}', '🧝🏻')">🧝🏻 الأميرة</button>
                        <button class="badge-btn btn-verified" onclick="setBadge('${user.uid}', '🔵')">🔵 توثيق</button>
                        <button class="badge-btn btn-reset" onclick="setBadge('${user.uid}', '')">🔻 سحب</button>
                    </div>

                `;
                container.appendChild(card);
            });
        }

        function setBadge(uid, badgeName) {
            db.collection("users").doc(uid).update({
                badge: badgeName
            }).then(() => {
                console.log("تم تحديث الرتبة بنجاح في Firestore");
            }).catch(err => {
                alert('خطأ أثناء حفظ الرتبة: ' + err.message);
            });
        }

        function filterUsers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allUsersData.filter(u => {
                const name = (u.username || u.name || u.displayName || '').toLowerCase();
                const email = (u.email || '').toLowerCase();
                return name.includes(query) || email.includes(query);
            });
            renderUsers(filtered);
        }
    </script>
</body>
</html>
