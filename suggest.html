<script>
document.addEventListener('DOMContentLoaded', () => {
    const lang = localStorage.getItem('wasl_app_lang') || localStorage.getItem('appLanguage') || 'ar';
    
    if (lang === 'en') {
        document.documentElement.dir = 'ltr';
        document.documentElement.lang = 'en';
        
        // استبدال النصوص مباشرة
        document.body.innerHTML = document.body.innerHTML
            .replace(/اقترح ميزة/g, 'Suggest a Feature')
            .replace(/العودة/g, 'Back')
            .replace(/اكتب اقتراحك أو الميزات التي ترغب بإضافتها للتطبيق\. يصل اقتراحك مباشرة لمطور التطبيق\./g, "Write your suggestion or features you'd like to add. Your feedback goes directly to the developer.")
            .replace(/اكتب اقتراحك هنا\.\.\./g, 'Write your suggestion here...')
            .replace(/إرسال الاقتراح/g, 'Submit Suggestion')
            .replace(/اقتراحات المستخدمين \(خاصة بالمطور\):/g, 'User Suggestions (Developer Only):');
    }
});
</script>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اقترح ميزة</title>
    <!-- مكتبات الفايربيس -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            resize: none;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: inherit;
        }

        textarea:focus {
            border-color: #3b82f6;
        }

        .send-btn {
            width: 100%;
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:active {
            background: #2563eb;
        }

        /* قسم المطور (يظهر لك فقط) */
        .developer-section {
            margin-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            display: none;
        }

        .suggestion-card {
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 10px;
        }

        .suggestion-user {
            color: #60a5fa;
            font-size: 12px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .suggestion-text {
            color: #e2e8f0;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h3 style="margin: 0;">💡 اقترح ميزة</h3>
        <button class="back-btn" onclick="window.history.back()">➔ العودة</button>
    </div>

    <div class="container">
        <p style="font-size: 13px; color: #94a3b8; margin-top: 0; line-height: 1.5;">
            اكتب اقتراحك أو الميزات التي ترغب بإضافتها للتطبيق. يصل اقتراحك مباشرة لمطور التطبيق.
        </p>
        
        <textarea id="suggestionInput" placeholder="اكتب اقتراحك هنا..."></textarea>
        <button id="sendBtn" class="send-btn" onclick="submitSuggestion()">إرسال الاقتراح</button>

        <!-- يظهر فقط للمطور -->
        <div id="developerSection" class="developer-section">
            <h4 style="color: #f59e0b; margin-top: 0;">👑 اقتراحات المستخدمين (خاصة بالمطور):</h4>
            <div id="suggestionsList">
                <p style="color: #64748b; font-size: 12px;">جاري تحميل الاقتراحات...</p>
            </div>
        </div>
    </div>

    <script>
        // إعدادات الفايربيس الخاصة بمشروع Wasl
        const firebaseConfig = {
            apiKey: "AIzaSyBM_LkZr59WM4fnTvW0CKbcj-y2V8Flqto",
            authDomain: "wasl-4f5cb.firebaseapp.com",
            databaseURL: "https://wasl-4f5cb-default-rtdb.firebaseio.com",
            projectId: "wasl-4f5cb",
            storageBucket: "wasl-4f5cb.firebasestorage.app",
            messagingSenderId: "754785038144",
            appId: "1:754785038144:web:ca48f718b71148ae3394a5",
            measurementId: "G-8TMN0ER8Z3"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const DEVELOPER_EMAIL = "ll9758829@gmail.com";

        // التحقق من هوية المطور عند فتح الصفحة
        firebase.auth().onAuthStateChanged((user) => {
            if (user && user.email === DEVELOPER_EMAIL) {
                document.getElementById('developerSection').style.display = 'block';
                loadSuggestions();
            }
        });

        // دالة الإرسال
        function submitSuggestion() {
            const input = document.getElementById('suggestionInput');
            const btn = document.getElementById('sendBtn');
            const text = input.value.trim();

            if (!text) {
                alert('الرجاء كتابة اقتراح أولاً!');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'جاري الإرسال...';

            const currentUser = firebase.auth().currentUser;
            const userName = currentUser ? (currentUser.displayName || currentUser.email) : "مستخدم مجهول";

            firebase.database().ref('suggestions').push({
                userName: userName,
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                alert('شكراً لك! تم إرسال اقتراحك بنجاح.');
                input.value = '';
            }).catch((err) => {
                alert('حدث خطأ أثناء الإرسال: ' + err.message);
            }).finally(() => {
                btn.disabled = false;
                btn.innerText = 'إرسال الاقتراح';
            });
        }

        // دالة عرض الاقتراحات للمطور فقط
        function loadSuggestions() {
            const listContainer = document.getElementById('suggestionsList');
            firebase.database().ref('suggestions').on('value', (snapshot) => {
                listContainer.innerHTML = '';
                if (!snapshot.exists()) {
                    listContainer.innerHTML = '<p style="color: #64748b; font-size: 12px;">لا توجد اقتراحات حالياً.</p>';
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    const date = data.timestamp ? new Date(data.timestamp).toLocaleString('ar-EG') : '';
                    
                    const card = document.createElement('div');
                    card.className = 'suggestion-card';
                    card.innerHTML = `
                        <div class="suggestion-user">
                            <span>👤 ${data.userName}</span>
                            <span>⏱️ ${date}</span>
                        </div>
                        <div class="suggestion-text">${data.text}</div>
                    `;
                    listContainer.prepend(card);
                });
            }, (err) => {
                listContainer.innerHTML = `<p style="color: #ef4444; font-size: 12px;">خطأ في التحميل: ${err.message}</p>`;
            });
        }
    </script>






<script>
document.addEventListener('DOMContentLoaded', () => {
    const lang = localStorage.getItem('wasl_app_lang') || localStorage.getItem('appLanguage') || 'ar';
    
    if (lang === 'en') {
        // البحث عن الزر واستبدال النص مباشرة مع الإيموجي
        document.querySelectorAll('button, a, div').forEach(el => {
            if (el.children.length === 0 && el.textContent.includes('اقترح')) {
                el.textContent = '💡 Suggest';
            }
        });
    }
});
</script>

  
</body>
</html>
